
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rypiq"
version = "0.1.0"
description = "A modular RAG toolkit"
requires-python = ">= 3.14.3"

dependencies = [
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "llama-cpp-python",
  "chromadb",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[project.scripts]
rypiq = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: Tests isolated components",
  "integration: Tests component interactions",
]

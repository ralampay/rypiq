
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rypiq"
version = "0.1.0"
description = "A modular RAG toolkit"
requires-python = ">= 3.14.3"

dependencies = [
  "python-dotenv",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "python-pptx>=1,<2",
  "llama-cpp-python",
  "openai>=2,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "pgvector>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov>=7,<8",
  "coverage>=7.10,<8",
]

[project.scripts]
rypiq = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
  "unit: Tests isolated components",
  "integration: Tests component interactions",
]

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
